name: "emjuh"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-next]

concurrency:
  group: emjuh-workflow-lock
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target: ['71', '72']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome & Hapus Chromedriver Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable
        sudo rm -f /usr/bin/chromedriver

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    # AUTO-TRIGGER MENGGUNAKAN BASH & CURL (Dijalankan di background)
    - name: Start Independent 1-Minute Auto-Trigger Process
      if: matrix.target == '71'
      env:
        GH_TOKEN: ${{ secrets.MY_PAT }}
      run: |
        (
          sleep 60
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/emjuh.yml/dispatches \
            -d '{"ref":"main"}'
        ) &

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FILE_ID }}
        TARGET_ACCOUNT: ${{ matrix.target }}
      run: python download_drive.py

    - name: Run All Subfolder Bots In Parallel
      run: |
        python3 -c "
        import os, subprocess

        target = '${{ matrix.target }}'
        processes = []

        def run_bot_loop(bot_dir):
            cmd = f'until python3 sm.py; do echo \"[!] Bot di {bot_dir} terhenti. Restart dalam 5s...\"; sleep 5; done'
            return subprocess.Popen(cmd, shell=True, cwd=bot_dir, executable='/bin/bash')

        if os.path.exists(target):
            for root, dirs, files in os.walk(target):
                if 'sm.py' in files:
                    print(f'==> Menjalankan Bot dengan Auto-Restart di: {root}')
                    p = run_bot_loop(root)
                    processes.append(p)

            for p in processes:
                p.wait()
        else:
            print(f'[!] ERROR: Folder {target} tidak ditemukan!')
            exit(1)
        "
