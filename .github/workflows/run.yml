name: "emjuh"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-next]

# Kunci global agar tidak ada 2 workflow yang masuk stage persiapan bersamaan
concurrency:
  group: emjuh-workflow-lock
  cancel-in-progress: false

jobs:
  # JOB 1: Jalankan Bot Matriks Paralel Terlebih Dahulu
  run-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        target: ['71']

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google Chrome & Hapus Chromedriver Sistem
      run: |
        sudo apt-get update
        sudo apt-get install -y wget google-chrome-stable
        sudo rm -f /usr/bin/chromedriver

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib selenium requests selenium-stealth undetected-chromedriver

    - name: Download & Extract Files from Google Drive
      env:
        GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FILE_ID }}
        TARGET_ACCOUNT: ${{ matrix.target }}
      run: python download_drive.py

    # START TIMER TRIGGER NEXT WORKFLOW DI LOKAL RUNNER BOT
    - name: Start Independent 5-Minute Auto-Trigger Process
      env:
        GH_TOKEN: ${{ secrets.MY_PAT || secrets.GITHUB_TOKEN }}
      run: |
        nohup python3 -c "
        import time, os, urllib.request, json
        time.sleep(300)
        repo = os.environ.get('GITHUB_REPOSITORY')
        token = os.environ.get('GH_TOKEN')
        url = f'https://api.github.com/repos/{repo}/dispatches'
        req = urllib.request.Request(url, method='POST')
        req.add_header('Authorization', f'Bearer {token}')
        req.add_header('Accept', 'application/vnd.github+json')
        data = json.dumps({'event_type': 'trigger-next'}).encode('utf-8')
        try:
            urllib.request.urlopen(req, data=data)
        except Exception as e:
            print('Trigger error:', e)
        " > /dev/null 2>&1 &

    - name: Run All Subfolder Bots In Parallel
      run: |
        python3 -c "
        import os, subprocess

        target = '${{ matrix.target }}'
        processes = []

        def run_bot_loop(bot_dir):
            cmd = f'until python3 sm.py; do echo \"[!] Bot di {bot_dir} terhenti. Restart dalam 5s...\"; sleep 5; done'
            return subprocess.Popen(cmd, shell=True, cwd=bot_dir, executable='/bin/bash')

        if os.path.exists(target):
            for root, dirs, files in os.walk(target):
                if 'sm.py' in files:
                    print(f'==> Menjalankan Bot dengan Auto-Restart di: {root}')
                    p = run_bot_loop(root)
                    processes.append(p)

            for p in processes:
                p.wait()
        else:
            print(f'[!] ERROR: Folder {target} tidak ditemukan!')
            exit(1)
        "

  # JOB 2: Membunuh Workflow Lama (#31) HANYA SETELAH Job 1 (#32) Dipastikan Mulai
  kill-previous:
    runs-on: ubuntu-latest
    needs: run-bots # Wajib menunggu job run-bots di atas mulai teralokasi
    steps:
    - name: Kill Previous Running Workflows
      env:
        GH_TOKEN: ${{ secrets.MY_PAT || secrets.GITHUB_TOKEN }}
      run: |
        python3 -c "
        import os, urllib.request, json

        repo = os.environ.get('GITHUB_REPOSITORY')
        token = os.environ.get('GH_TOKEN')
        current_run_id = os.environ.get('GITHUB_RUN_ID')

        url = f'https://api.github.com/repos/{repo}/actions/workflows/emjuh.yml/runs?status=in_progress'
        req = urllib.request.Request(url)
        req.add_header('Authorization', f'Bearer {token}')
        req.add_header('Accept', 'application/vnd.github+json')

        try:
            res = urllib.request.urlopen(req)
            data = json.loads(res.read().decode('utf-8'))
            for run in data.get('workflow_runs', []):
                run_id = str(run['id'])
                if run_id != str(current_run_id):
                    print(f'[!] Membunuh Workflow Run lama ID: {run_id}')
                    cancel_url = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel'
                    cancel_req = urllib.request.Request(cancel_url, method='POST')
                    cancel_req.add_header('Authorization', f'Bearer {token}')
                    cancel_req.add_header('Accept', 'application/vnd.github+json')
                    urllib.request.urlopen(cancel_req)
        except Exception as e:
            print(f'Gagal cancel run lama: {e}')
        "
